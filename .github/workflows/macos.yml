name: Build macOS DMG
on:
  workflow_dispatch:
  push:
    branches: [arena/1750a609-ai-assistant]
jobs:
  dmg:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: AETHER-macOS-unsigned-DMG
          path: dist/*.dmg
          retention-days: 14
